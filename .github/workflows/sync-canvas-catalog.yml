name: sync-canvas-catalog

on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate catalog
        working-directory: .github/extensions/canvas-ninja
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-catalog.mjs
      - name: Open PR when the catalog changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # generatedAt always changes, so ignore that line when comparing
          if git diff --quiet -I'"generatedAt"' -- .github/extensions/canvas-ninja/resources/catalog.json; then
            echo "no catalog changes"; exit 0
          fi
          branch="chore/canvas-catalog-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add .github/extensions/canvas-ninja/resources/catalog.json
          git commit -m "chore: sync Canvas Ninja catalog"
          git push origin "$branch"
          gh pr create --title "chore: sync Canvas Ninja catalog" --body "Automated catalog refresh. New entries need a Japanese description in resources/catalog-ja.json (the test workflow enforces this)." --base main
