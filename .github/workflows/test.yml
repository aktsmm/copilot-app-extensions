name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  canvas-ninja:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/extensions/canvas-ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check extension.mjs && node --check ui/app.js && node --check core/ui.mjs
      - run: node --test test/*.test.mjs

  skill-ninja:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/extensions/skill-ninja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/*.test.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
